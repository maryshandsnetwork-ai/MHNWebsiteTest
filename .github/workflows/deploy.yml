name: Deploy to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage files for deploy
        run: |
          mkdir -p _deploy
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_deploy' \
            --exclude='README.md' \
            --exclude='vercel.json' \
            --exclude='.DS_Store' \
            ./ _deploy/

      - name: Upload via SFTP
        run: |
          sudo apt-get install -y lftp
          lftp -c "set sftp:auto-confirm yes; set net:timeout 30; set net:max-retries 3; open sftp://dh_n5xhce:${{ secrets.DREAMHOST_SFTP_PASSWORD }}@ams1-shared-02.dreamhost.com; mirror -R --delete --verbose _deploy/ /home/dh_n5xhce/maryshandsnetwork.org/"
