name: Deploy to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage files for deploy
        run: |
          mkdir -p _deploy
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_deploy' \
            --exclude='README.md' \
            --exclude='vercel.json' \
            --exclude='.DS_Store' \
            ./ _deploy/

      - name: Upload via SFTP
        env:
          SSHPASS: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=10" \
            _deploy/ dh_n5xhce@ams1-shared-02.dreamhost.com:/home/dh_n5xhce/maryshandsnetwork.org/
